# Noctalia — the desktop shell (bar, launcher, notifications, lock, wallpaper).
# Only keys that differ from upstream defaults; GUI changes go to
# ~/.local/state/noctalia/settings.toml. Reference: noctalia example.toml.

[shell]
# Launcher/dock/taskbar apps run as their own systemd units (app-*@*.service)
# instead of inside noctalia.service: they survive a Noctalia restart, get
# their own memory accounting, and systemd-oomd can target the offender.
launch_apps_as_systemd_services = true
# Noctalia's themed admin password prompt (the only polkit agent).
polkit_agent = true

[theme]
mode   = "dark"
source = "wallpaper"                  # Material You colors from the wallpaper

[theme.templates]
# Apps follow the wallpaper palette.
#   gtk3/gtk4: writes gtk-*/noctalia.css + imports it in gtk.css (adw-gtk3)
#   vscode:    read by the "NoctaliaTheme" extension (Noctalia.noctaliatheme)
# Kitty, tmux, Hyprland borders, hyprlock and Neovim use the user templates
# below (same palette as the shell, so everything always matches). They're
# re-rendered whenever the palette changes (new wallpaper or scheme).
builtin_ids   = ["gtk3", "gtk4"]
community_ids = ["vscode"]

# templates/<name> → ~/.config/theme/generated/<name> (read by each app).
[theme.templates.user.hypr]
input_path  = "templates/hypr.lua"
output_path = "$XDG_CONFIG_HOME/theme/generated/hypr.lua"

[theme.templates.user.hyprlock]
input_path  = "templates/hyprlock.conf"
output_path = "$XDG_CONFIG_HOME/theme/generated/hyprlock.conf"

[theme.templates.user.kitty]
input_path  = "templates/kitty.conf"
output_path = "$XDG_CONFIG_HOME/theme/generated/kitty.conf"

[theme.templates.user.tmux]
input_path  = "templates/tmux.conf"
output_path = "$XDG_CONFIG_HOME/theme/generated/tmux.conf"

# Seed color for Thorium's own Material You theme: a root watcher
# (thorium-theme@.path, `setup-system.sh thorium-theme`) turns it into the
# BrowserThemeColor policy, so the browser follows the wallpaper too.
[theme.templates.user.thorium]
input_path  = "templates/thorium-seed"
output_path = "$XDG_CONFIG_HOME/theme/generated/thorium-seed"

[theme.templates.user.nvim]
input_path  = "templates/nvim.lua"
output_path = "$XDG_CONFIG_HOME/theme/generated/nvim.lua"
index       = 10                      # last: then reload every app at once
post_hook   = "~/.local/bin/rice-wall reload"

[hooks]
# Wallpapers picked in Noctalia's picker become rice-wall's saved wallpaper.
# (Colors come from the user templates above, not from this hook.)
wallpaper_changed = "~/.local/bin/rice-wall adopt \"$NOCTALIA_WALLPAPER_PATH\""

[calendar]
# Events in the Control Center calendar (read-only). The account below is
# only a declaration: sign in once per machine via Settings → Calendar →
# Accounts → "Google" → Save and Connect. The refresh token lives in the
# keyring (Secret Service), never in this repo.
enabled         = true
refresh_minutes = 15
event_time_format = "%H:%M"

[calendar.account.google]
type  = "google"
name  = "Google"
color = "primary"

[calendar.reminders]
enabled              = true
use_event_reminders  = true       # per-event reminders from Google
default_lead_minutes = 10         # events without one
all_day_digest_time  = "09:00"    # one notification listing today's all-day events

[nightlight]
# "Eye Comfort Shield": a plain manual on/off on the Control Center's Night
# Light button (left-click) and Super+Alt+N. Day and night temperatures are
# (almost) equal, so the schedule below changes nothing: on ≈ 4500K, off =
# neutral. (Noctalia only toggles when some schedule exists.)
# Warmth: lower = warmer/more orange (3200 strong, 4500 mild, 5500 subtle).
# Applies to every screen, so the MSI's own anti-blue mode stays OFF.
enabled           = false
force             = false
temperature_day   = 4600          # keep 100K above night (must be > night)
temperature_night = 4500

[location]
custom_schedule = true            # times barely matter (day ≈ night temp);
sunset          = "20:00"         # no location is looked up or sent
sunrise         = "07:00"

[lockscreen]
# Noctalia's lock screen is the locker (hypr/scripts/lock routes Super+L /
# hypridle here; hyprlock only if Noctalia is down). It also locks on
# `loginctl lock-session` and before suspend.
enabled = true

# ── Plugins ──────────────────────────────────────────────────────────────────
# Plugins are unsandboxed Luau running as you: only auto-update the official
# ones; community plugins update when you choose (Settings → Plugins).
[plugins]
enabled     = ["rxtsel/portctl", "yuuto/arch-updater"]
auto_update = "official"
# (Charge cap: built into Control Center → power, via UPower; no plugin.)

# pacman + AUR updates: bar counter (`updates`), panel with the package list,
# Update runs yay in a terminal (prompts/PKGBUILD review as usual). `/arch`
# in the launcher.
[plugin_settings."yuuto/arch-updater"]
aur_helper        = "yay"
flatpak_enabled   = false
auto_check_hours  = 6
notify_on_updates = true
check_arch_news   = true
update_mode       = "terminal"

[widget.updates]
type = "yuuto/arch-updater:widget"

# Listening ports + kill, for stuck dev servers.
[plugin_settings."rxtsel/portctl"]
refresh_interval  = 10                # seconds; default 5, halved for battery
hide_system_ports = true

[widget.portctl]
type = "rxtsel/portctl:indicator"

# ── Bar ──────────────────────────────────────────────────────────────────────
# Base layout. The Settings window writes overrides to
# .local/state/noctalia/settings.toml, which is also tracked in this repo
# (stowed symlink), so GUI changes show up in `git diff` automatically.
[bar.default]
start  = ["launcher", "workspaces", "active_window"]
center = ["clock"]
end    = ["caffeine", "privacy", "media", "tray", "cpu", "ram", "notifications",
          "network", "bluetooth", "volume", "brightness", "power_profile",
          "battery", "control-center", "session"]

[widget.launcher]
type                  = "launcher"
# Arch logo from the base `filesystem` package (present on every Arch
# install), tinted with the widget color so it follows the wallpaper palette.
custom_image          = "/usr/share/pixmaps/archlinux-logo.svg"
custom_image_colorize = true

[widget.media]
type               = "media"
hide_when_no_media = true         # no player open → no widget
hide_when_idle     = true         # paused/stopped → hidden too (5.3.0+)

[widget.clock]
type           = "clock"
format         = "{:%H:%M}"
tooltip_format = "{:%A, %d %B %Y}"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.ram]
type = "sysmon"
stat = "ram_pct"

# Only shown while the mic, camera or screen capture is in use.
[widget.privacy]
type          = "privacy"
hide_inactive = true
