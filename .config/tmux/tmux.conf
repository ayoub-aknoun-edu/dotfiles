# ~/.config/tmux/tmux.conf
# Stowed from ~/dotfiles/.config/tmux/tmux.conf — edit the repo copy.
# Terminal: kitty · Shell: zsh · Theme: Catppuccin Macchiato · No plugin manager.
# Reload after editing: prefix + r

# ── General ──────────────────────────────────────────────────────────────────
# Keep the default prefix: Ctrl+b
set -g prefix C-b

# kitty starts zsh but the login shell ($SHELL) is bash; use zsh in tmux too
set -g default-shell /usr/bin/zsh

# No delay after Esc (vim / Claude Code feel instant)
set -sg escape-time 0

# Pass focus in/out events to apps (editors reload files, etc.)
set -g focus-events on

# Large scrollback — Claude Code produces lots of output
set -g history-limit 50000

# Show messages a bit longer
set -g display-time 2000

# ── Mouse ────────────────────────────────────────────────────────────────────
# Click to select panes/windows, wheel to scroll, drag borders to resize
set -g mouse on

# ── Terminal capabilities (kitty) ────────────────────────────────────────────
# Inside tmux, TERM is tmux-256color; tell tmux what the outer kitty supports:
#   RGB       24-bit true color
#   extkeys   extended keys (Shift+Enter, Ctrl+Shift combos)
#   clipboard OSC 52 clipboard writes
#   focus     focus events
#   sync      synchronized updates (less flicker)
#   hyperlinks / usstyle  OSC 8 links, styled underlines
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys:clipboard:focus:sync:hyperlinks:usstyle"

# Extended keys so Shift+Enter reaches Claude Code inside tmux
set -s extended-keys on
set -s extended-keys-format csi-u

# Let apps send escape sequences straight to kitty (notifications, images)
set -g allow-passthrough on

# Let apps inside tmux (nvim, Claude Code) set the system clipboard via OSC 52
set -s set-clipboard on

# ── Windows & panes numbering ────────────────────────────────────────────────
# Start at 1 (matches the keyboard) and close gaps when a window is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Key bindings ─────────────────────────────────────────────────────────────
# Splits keep the current directory:  prefix |  side by side,  prefix -  stacked
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation: prefix h/j/k/l
# (overrides the default prefix l = last-window)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload this config: prefix r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ── Copy mode (vi) → Wayland clipboard ───────────────────────────────────────
# prefix [ to enter, v to select, C-v for block, y / Enter / mouse drag to copy
setw -g mode-keys vi
set -s copy-command "wl-copy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ── Status bar (Catppuccin Macchiato, matches ~/.config/theme) ───────────────
# Left: session name (turns peach while the prefix is pressed)
# Middle: window list · Right: date and time
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e2030,fg=#cad3f5"

set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=#f5a97f],#[bg=#c6a0f6]}#[fg=#181926,bold] #S #[default] "

set -g status-right-length 40
set -g status-right "#[fg=#a5adcb]%a %d %b #[bg=#363a4f,fg=#cad3f5,bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#6e738d] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[bg=#8aadf4,fg=#181926,bold] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-activity-style "fg=#eed49f"

# Pane borders, messages, copy-mode selection
set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#c6a0f6"
set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#cad3f5"
setw -g mode-style "bg=#494d64,fg=#cad3f5"
set -g display-panes-active-colour "#c6a0f6"
set -g display-panes-colour "#6e738d"

# Wallpaper-driven overrides (theme/generated via rice-wall); absent = Macchiato above.
source-file -q ~/.config/theme/generated/tmux.conf

# ── Session persistence (survives reboot) ────────────────────────────────────
# tmux-resurrect saves/restores sessions, windows, panes, cwd and layout;
# tmux-continuum auto-saves every 10 min and restores when the server starts.
# Plugins live outside the repo:
#   git clone https://github.com/tmux-plugins/tmux-resurrect ~/.local/share/tmux/plugins/tmux-resurrect
#   git clone https://github.com/tmux-plugins/tmux-continuum ~/.local/share/tmux/plugins/tmux-continuum
# Manual: prefix C-s save · prefix C-r restore
set -g @resurrect-dir "~/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents "on"
# Re-launch Claude Code in its window; --resume opens the picker for that dir
set -g @resurrect-processes '"claude->claude --resume"'
set -g @continuum-restore "on"
set -g @continuum-save-interval "10"

# Must stay LAST: continuum hooks its auto-save into status-right, so it has to
# load after the theme sets status-right above.
if-shell "test -d ~/.local/share/tmux/plugins/tmux-resurrect" \
  "run-shell ~/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -d ~/.local/share/tmux/plugins/tmux-continuum" \
  "run-shell ~/.local/share/tmux/plugins/tmux-continuum/continuum.tmux"
