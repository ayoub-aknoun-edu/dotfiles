# Generated by matugen from {{image}} — do not edit (see theme/matugen)
set -g status-style "bg={{colors.surface_container_low.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g status-left "#{?client_prefix,#[bg={{colors.tertiary.default.hex}}],#[bg={{colors.primary.default.hex}}]}#[fg={{colors.on_primary.default.hex}},bold] #S #[default] "
set -g status-right "#[fg={{colors.on_surface_variant.default.hex}}]%a %d %b #[bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}},bold] %H:%M "
setw -g window-status-format "#[fg={{colors.outline.default.hex}}] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[bg={{colors.secondary.default.hex}},fg={{colors.on_secondary.default.hex}},bold] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-activity-style "fg={{colors.tertiary.default.hex}}"
set -g pane-border-style "fg={{colors.surface_container_high.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"
set -g message-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g message-command-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
setw -g mode-style "bg={{colors.surface_container_highest.default.hex}},fg={{colors.on_surface.default.hex}}"
set -g display-panes-active-colour "{{colors.primary.default.hex}}"
set -g display-panes-colour "{{colors.outline.default.hex}}"
