# Only runs inside the classic shell (see rice-classic.target). The
# ExecCondition also blocks D-Bus activation, so swaync can't grab
# org.freedesktop.Notifications while Noctalia is the active shell.
[Unit]
PartOf=rice-classic.target
# Refused activations (condition false) must not trip the start rate limit.
StartLimitIntervalSec=0

[Service]
ExecCondition=/usr/bin/sh -c '[ "$$(cat %h/.local/state/rice/shell 2>/dev/null || echo classic)" = classic ]'
