# Compositor priority (UWSM runs Hyprland as wayland-wm@hyprland.desktop.service).
# Hyprland runs at normal priority (since 0.57.2 it no longer takes real-time,
# which got it SIGKILLed under load). Instead, give it 10x the CPU share of apps and agents
# (default weight 100), and keep its memory out of swap, so the cursor stays
# smooth during heavy builds/tests.
[Service]
CPUWeight=1000
MemoryLow=768M
