# hyprsunset (started by hyprsunset.service)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# A single profile keeps a constant 5000K. For automatic day/night instead,
# replace it with e.g.:
#   profile { time = 07:00  identity = true }
#   profile { time = 20:00  temperature = 4500 }
# ~/.local/bin/eyecare-toggle switches temperature at runtime over IPC.

profile {
    time = 00:00
    temperature = 5000
}
