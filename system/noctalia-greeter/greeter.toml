# /var/lib/noctalia-greeter/greeter.toml — installed by
# scripts/setup-system.sh greeter / greeter-config (@USER@ → your username).
# Wallpaper + palette come from Noctalia's greeter sync (auto-sync is on);
# these are the declarative defaults: no branding/scheme picker, the lock
# screen's font, and its bottom-left clock.

[session]
default = "Hyprland (uwsm-managed)"

[user]
default = "@USER@"

[appearance]
scheme = "Synced"
hide_logo = true
scheme_selector_position = "hidden"
power_buttons_position = "bottom-right"
font_family = "IBM Plex Sans Light"
corner_radius_scale = 1.4

# Editorial clock like the lock screen (needs noctalia-greeter >= 1.7.0)
[clock]
position    = "bottom-left"
time_format = "{:%H:%M}"
date_format = "%A, %-d %B"

[keyboard]
layout = "us"

[cursor]
size = 24
