# /etc/systemd/coredump.conf.d/50-size-limit.conf — scripts/setup-system.sh coredump-limit
# 2026-11-16 20:39: 15 dotnet test processes crashed within 20 s; processing
# their multi-GB core dumps froze the desktop. Skip dumps of processes over
# 1 GiB (they were never stored anyway); small crashes are still recorded.
[Coredump]
ProcessSizeMax=1G
ExternalSizeMax=1G
