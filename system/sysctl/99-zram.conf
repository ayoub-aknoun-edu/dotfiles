# /etc/sysctl.d/99-zram.conf — installed by scripts/setup-system.sh memory
# Swap is zram (compressed RAM, zram-generator): far faster than disk, so let
# the kernel use it earlier and read single pages (values used by Fedora /
# Pop!_OS for zram). Keeps the desktop responsive when memory runs tight.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
