# /etc/systemd/system/user@.service.d/90-oomd.conf — scripts/setup-system.sh memory
# systemd-oomd watches your session: if memory pressure stays above 50 % for
# 20 s (the system is thrashing), it kills the app unit causing it (apps are
# separate units: Noctalia launch_apps_as_systemd_services) instead of the
# whole machine freezing until the kernel OOM killer picks something.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
